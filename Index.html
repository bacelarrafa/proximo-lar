<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Próximo Lar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F5F5EF;--surface:#FFFEFB;--surface-2:#EEEEE6;--ink:#22302A;--muted:#66726A;--line:#E1E1D7;
  --moss:#4E6B4B;--on-moss:#FFFFFF;--moss-soft:#E3EBDD;
  --oak:#A9773E;--oak-soft:#F3E8D6;
  --rose:#B1574A;--rose-soft:#F5E0DB;
  --sky:#557587;--sky-soft:#E0E9EE;
  --pl:90%;--plan-l:34%;
  --shadow:0 1px 2px rgba(34,48,42,.05),0 8px 24px rgba(34,48,42,.07);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A17;--surface:#1D231F;--surface-2:#252C27;--ink:#E7EBE4;--muted:#9AA69D;--line:#323A34;
    --moss:#9CBF95;--on-moss:#131913;--moss-soft:#26342A;
    --oak:#D8AE74;--oak-soft:#3A3025;
    --rose:#E38E80;--rose-soft:#3D2623;
    --sky:#9EBDCD;--sky-soft:#22313A;
    --pl:22%;--plan-l:72%;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A17;--surface:#1D231F;--surface-2:#252C27;--ink:#E7EBE4;--muted:#9AA69D;--line:#323A34;
  --moss:#9CBF95;--on-moss:#131913;--moss-soft:#26342A;
  --oak:#D8AE74;--oak-soft:#3A3025;
  --rose:#E38E80;--rose-soft:#3D2623;
  --sky:#9EBDCD;--sky-soft:#22313A;
  --pl:22%;--plan-l:72%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;margin:0}
h2{font-size:26px}h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.muted{color:var(--muted)}.sm{font-size:13px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1260px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;white-space:nowrap}
.brand svg{width:30px;height:30px;color:var(--moss)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 13px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button.on{background:var(--moss-soft);color:var(--ink)}
main{max-width:1260px;margin:0 auto;padding:26px 20px 60px}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:6px 11px;font-size:13px}
.link{border:0;background:none;color:var(--moss);font-weight:600;cursor:pointer;padding:0;font-size:14px}

/* painel inicial */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:stretch;margin-bottom:22px}
.count{background:var(--moss);color:var(--on-moss);border-radius:20px;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;position:relative;overflow:hidden}
.count .num{font-family:"Bricolage Grotesque",sans-serif;font-size:92px;line-height:.9;font-weight:700;letter-spacing:-.04em}
.count .lbl{font-size:18px;max-width:28ch;opacity:.92}
.count .keys{position:absolute;right:-10px;bottom:-14px;width:190px;opacity:.16}
.count .row{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.count .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:inherit}
.count .btn.solid{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.fbar{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:10px;font-size:14px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.fbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fbar .fill{height:100%;border-radius:99px;background:var(--moss)}
.fbar b{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.p-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.vrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.vrow:first-of-type{border-top:0}
.vdate{width:50px;flex:none;text-align:center;border-radius:10px;background:var(--oak-soft);padding:6px 0;line-height:1.1}
.vdate b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
.vdate span{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;font-size:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;width:100%}
.card:hover{border-color:var(--moss)}
.plan{--h:140;position:relative;aspect-ratio:16/10;background:hsl(var(--h) 18% var(--pl));display:grid;place-items:center;color:hsl(var(--h) 22% var(--plan-l))}
.plan svg{width:72%;height:auto}
.plan svg *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.plan svg .f{stroke-width:1;opacity:.55}
.plan svg .dr{stroke-width:1;stroke-dasharray:2 2.5}
.plan .src{position:absolute;left:10px;top:10px;background:var(--surface);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink)}
.plan .score{position:absolute;right:10px;top:10px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--moss);color:var(--on-moss)}
.plan .score.mid{background:var(--oak);color:#fff}
.plan .score.low{background:var(--rose);color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.price{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.cb .t{font-weight:600}
.specs{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:6px;align-self:flex-start}
.tag.visit{background:var(--oak-soft);color:var(--ink)}
.tag.new{background:var(--sky-soft);color:var(--ink)}

/* funil */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin-top:4px;max-width:62ch}
.kanban-wrap{overflow-x:auto;padding-bottom:10px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;min-width:min-content}
.col{background:var(--surface-2);border-radius:14px;padding:10px;min-height:340px;display:flex;flex-direction:column;gap:10px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.col.over{border-color:var(--moss);background:var(--moss-soft)}
.col.trash{background:transparent;border:2px dashed var(--line);min-width:150px}
.col.trash.over{border-color:var(--rose);background:var(--rose-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:4px 4px 2px}
.col-h .n{margin-left:auto;color:var(--muted);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.col .card .plan{aspect-ratio:16/8}
.drop-hint{color:var(--muted);font-size:13px;text-align:center;padding:30px 8px}
.card.dragging{opacity:.4}

/* calendário */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-bar h2{min-width:200px;text-transform:none}
.gpill{display:inline-flex;align-items:center;gap:8px;background:var(--sky-soft);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.gpill i{width:8px;height:8px;border-radius:50%;background:#3E9B5A;display:inline-block}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--moss)}
.switch input:checked::after{transform:translateX(14px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.wd{background:var(--surface-2);padding:8px;font-size:12px;font-weight:600;color:var(--muted)}
.day{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;border:0;border-radius:0}
.day:hover{background:var(--bg)}
.day.out{background:var(--surface-2);cursor:default}
.day .dn{font-size:13px;font-weight:600;color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--moss);color:var(--on-moss)}
.ev{font-size:12px;line-height:1.3;border-radius:6px;padding:3px 6px;border:0;text-align:left;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.ev.v{background:var(--oak-soft);border-left:3px solid var(--oak);font-weight:600}
.ev.v.past{opacity:.6}
.ev.g{background:var(--sky-soft);border-left:3px solid var(--sky);color:var(--muted);cursor:default}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* motor */
.motor{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > span{font-size:13px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.in:focus{outline:2px solid var(--moss);outline-offset:-1px}
textarea.in{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--moss-soft);border-color:var(--moss)}
.chip .x{opacity:.6}
.chip-add{border-style:dashed;color:var(--muted)}
.src-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.src-row:first-of-type{border-top:0}
.src-row .meta{flex:1;min-width:0}
.src-row .meta b{display:block;font-size:14px}
.src-row .meta span{font-size:13px;color:var(--muted)}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px}
.trust li{display:flex;gap:10px;align-items:flex-start}
.trust svg{flex:none;width:18px;height:18px;color:var(--moss);margin-top:2px}
.integr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.int{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.int b{display:block}
.int .st{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--moss)}
.int .st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.steps li.done{color:var(--ink)}
.steps li.act{color:var(--ink);font-weight:600}
.steps .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.steps li.done .ic{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.steps li.act .ic{border-color:var(--moss);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.runbox{margin-top:18px}
.result-note{background:var(--moss-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin:4px 0 14px}

/* descartados */
.reason-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.reason-sum span{background:var(--rose-soft);border-radius:99px;padding:5px 12px;font-size:13px}
.drow{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.drow .plan{aspect-ratio:4/3;border-radius:10px;filter:grayscale(.6)}
.drow .why{font-size:14px;margin-top:4px}
.drow .why b{color:var(--rose)}

/* gaveta */
.shade{position:fixed;inset:0;background:rgba(20,26,22,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;transform:translateX(102%);transition:transform .25s ease;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dw-plan{aspect-ratio:16/8}
.dw-close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;z-index:2}
.dw-body{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.dw-top .price{font-size:30px}
.costs{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:2px}
.specgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.specgrid div{background:var(--surface-2);border-radius:10px;padding:9px 8px;text-align:center}
.specgrid b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
.specgrid span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.visitbox{background:var(--oak-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:14px}
.sec{border-top:1px solid var(--line);padding-top:16px}
.sec h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gem{font-family:Figtree,sans-serif;font-size:11px;font-weight:600;background:var(--sky-soft);border-radius:99px;padding:2px 8px;letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:14px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.attn{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.attn li{background:var(--rose-soft);border-radius:8px;padding:7px 10px}
.checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.checks li{display:flex;gap:7px;align-items:center}
.checks .ok{color:var(--moss);font-weight:700}
.checks .no{color:var(--rose);font-weight:700}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--moss)}
.timeline span{display:block;font-size:12px;color:var(--muted)}
.stage-sel{display:flex;gap:6px;flex-wrap:wrap}
.stage-sel button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.stage-sel button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,26,22,.42)}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.mbox h3{font-size:21px}
.lb{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--moss);width:16px;height:16px}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.reasons{display:flex;flex-wrap:wrap;gap:7px}
.rchip input{position:absolute;opacity:0;pointer-events:none}
.rchip span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.rchip input:checked + span{background:var(--rose-soft);border-color:var(--rose)}
.rchip input:focus-visible + span{outline:2px solid var(--moss)}
.busy{font-size:13px;color:var(--muted)}
.busy.warn{color:var(--rose)}
.preview{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.preview .plan{border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:40px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

@media (max-width:900px){
  .hero,.two,.motor{grid-template-columns:1fr}
  .integr{grid-template-columns:1fr}
  .count .num{font-size:72px}
}
@media (max-width:640px){
  main{padding:18px 14px 50px}
  .top-in{padding:10px 14px;gap:10px}
  .brand span{display:none}
  .day{min-height:70px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-left-width:0;border-radius:3px}
  .specgrid{grid-template-columns:repeat(3,1fr)}
  .frow4{grid-template-columns:1fr 1fr}
  .kv,.checks{grid-template-columns:1fr}

<body class="out">
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 16 6l11 9v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="19" r="3" fill="currentColor"/></svg>
      <span>Próximo Lar</span>
    </div>
    <nav class="tabs" aria-label="Seções">
      <button data-v="painel">Início</button>
      <button data-v="funil">Funil</button>
      <button data-v="calendario">Calendário</button>

    </nav>

  </div>
</header>
<main id="app"><p class="loading">Carregando...</p></main>
<div class="shade" id="shade" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="Detalhes do apartamento"></aside>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Supabase ===== */
const SUPABASE_URL = 'https://zexhnndbpvgwgrsfsoma.supabase.co';
const SUPABASE_KEY = 'COLE_AQUI_A_PUBLISHABLE_KEY'; // chave publishable (ou anon). Nunca a secret ou service_role.
/* ==================================================================== */

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso=()=>isoOf(new Date());
const parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=n=>n?'R$ '+Math.round(n).toLocaleString('pt-BR'):'?';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fd=s=>{if(!s)return'';const d=parseIso(s.slice(0,10));return `${d.getDate()}/${pad(d.getMonth()+1)}`};
const fdl=s=>{const d=parseIso(s);return `${SEM[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`};

const STAGES=[
  {k:'novo',l:'Novos',c:'var(--sky)'},
  {k:'favorito',l:'Interessantes',c:'var(--oak)'},
  {k:'visita',l:'Visita agendada',c:'#C98E3B'},
  {k:'visitado',l:'Visitados',c:'var(--moss)'},
  {k:'proposta',l:'Proposta',c:'var(--ink)'},
  {k:'descartado',l:'Descartados',c:'var(--rose)'}
];
const stageName=k=>STAGES.find(s=>s.k===k)?.l||k;
const REASONS=['Acima do orçamento','Localização','Planta ou tamanho','Condomínio caro','Estado de conservação','Barulho ou vizinhança','Não aceita gatos ou telas','Documentação irregular','Anúncio falso ou desatualizado','Já vendido','Outro'];
const PLANS=[
 `<rect x="8" y="8" width="104" height="64" rx="2"/><path d="M52 8v22M52 42v30M52 40h20M84 40h28M80 8v32"/><path d="M52 30a10 10 0 0 1 10 10" class="dr"/><path d="M72 40a8 8 0 0 1 8-8" class="dr"/><rect x="86" y="14" width="18" height="20" rx="2" class="f"/><rect x="60" y="48" width="22" height="10" rx="2" class="f"/><circle cx="28" cy="42" r="8" class="f"/>`,
 `<rect x="8" y="8" width="104" height="64" rx="2"/><path d="M8 38h30M48 38h10M58 8v64M58 30h54M86 30v42"/><path d="M38 38a10 10 0 0 1 10-10" class="dr"/><rect x="14" y="14" width="20" height="16" rx="2" class="f"/><rect x="92" y="40" width="14" height="22" rx="2" class="f"/><rect x="66" y="40" width="14" height="10" rx="2" class="f"/><path d="M20 50h24v14H20z" class="f"/>`,
 `<rect x="8" y="8" width="104" height="64" rx="2"/><path d="M40 8v64M40 28h18M68 28h44M76 28v44M40 50h36"/><path d="M58 28a10 10 0 0 1 10 10" class="dr"/><rect x="84" y="36" width="20" height="18" rx="2" class="f"/><circle cx="58" cy="62" r="6" class="f"/><rect x="14" y="16" width="18" height="26" rx="2" class="f"/>`
];
const planSvg=i=>`<svg viewBox="0 0 120 80" aria-hidden="true">${PLANS[i%3]}</svg>`;
const KEYS=`<svg class="keys" viewBox="0 0 200 160" aria-hidden="true"><circle cx="70" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="10"/><path d="M96 82 170 150M140 122l16-14M154 136l14-12" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></svg>`;
const DEF_CRIT={bairros:[],min:600000,max:1000000,area:68,quartos:3,banheiros:2,vagas:1,cond:1100,pets:true,telas:true,metro:true,cozinha:true,suite:false};
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function bairroOk(b){if(!b||b==='Bairro não identificado')return null;const n=norm(b);return S.crit.bairros.some(x=>{const m=norm(x);return m&&(n.includes(m)||m.includes(n))})}

/* ---------- Supabase e estado ---------- */
// Se a chave não estiver no código, usa a que foi colada na tela inicial (guardada só neste navegador)
let SB_KEY=SUPABASE_KEY;
if(SB_KEY.startsWith('COLE')){try{SB_KEY=localStorage.getItem('proximo-lar-sbkey')||SB_KEY}catch(e){}}
const configurado=/^https:\/\//.test(SUPABASE_URL)&&!SB_KEY.startsWith('COLE');
const sb=configurado?supabase.createClient(SUPABASE_URL,SB_KEY):null;
const S={view:'painel',list:[],crit:{...DEF_CRIT},membros:{},user:null,open:null,calM:todayIso().slice(0,7),semAcesso:false};
try{const v=localStorage.getItem('proximo-lar-view');if(v)S.view=v}catch(e){}
const get=id=>S.list.find(l=>l.id===id);
const count=k=>S.list.filter(l=>l.stage===k).length;
const nomeDe=e=>S.membros[(e||'').toLowerCase()]||(e||'').split('@')[0];

function normCondo(c){c=c||{};return{nome:c.nome,ano:c.ano,torres:c.torres,unid:c.unidades,lazer:Array.isArray(c.lazer)?c.lazer:[],portaria:c.portaria,pets:c.aceita_pets,telas:c.permite_telas,nota:c.nota,aval:c.avaliacoes,metro:c.transporte,metroDist:c.metro_distancia_m,resumo:c.resumo,atencao:Array.isArray(c.atencao)?c.atencao:[],fontes:c.fontes}}
function fromRow(r){const h=hash(r.id);return{
 id:r.id,url:r.url,fonte:r.fonte||'Link',titulo:r.titulo||'',bairro:r.bairro||'Bairro não identificado',endereco:r.endereco||'',
 preco:+r.preco||0,cond:+r.valor_condominio||0,iptu:+r.iptu_mensal||0,area:+r.area||0,quartos:r.quartos,suites:r.suites,banheiros:r.banheiros,vagas:r.vagas,andar:r.andar||'',
 cozinhaAmpla:r.cozinha_ampla,descricao:r.descricao||'',condo:normCondo(r.condominio),alertas:Array.isArray(r.alertas)?r.alertas:[],
 stage:r.etapa,prev:r.etapa_anterior,visita:r.visita_data?{data:r.visita_data,hora:(r.visita_hora||'').slice(0,5),com:r.visita_com||''}:null,
 descarte:r.etapa==='descartado'?{motivo:r.descarte_motivo,obs:r.descarte_obs,d:r.descartado_em}:null,
 notas:r.notas||'',criadoPor:r.criado_por,criadoEm:r.criado_em,
 hist:(r.apto_historico||[]).sort((a,b)=>a.criado_em.localeCompare(b.criado_em)).map(x=>({d:x.criado_em,t:x.texto,a:x.autor})),
 hue:h%360,plan:h%3}}

async function load(){
 const [ap,cfg,mb]=await Promise.all([
  sb.from('apto_apartamentos').select('*, apto_historico(*)').order('criado_em',{ascending:false}),
  sb.from('apto_configuracoes').select('criterios').eq('id',1).maybeSingle(),
  sb.from('apto_membros').select('email,nome')]);
 if(ap.error){$('#app').innerHTML=`<p class="loading">Não foi possível carregar os dados: ${esc(ap.error.message)}</p>`;return}
 S.membros=Object.fromEntries((mb.data||[]).map(m=>[m.email.toLowerCase(),m.nome]));
 S.semAcesso=!(mb.data||[]).length;
 S.list=(ap.data||[]).map(fromRow);
 if(cfg.data?.criterios)S.crit={...DEF_CRIT,...cfg.data.criterios};
 $('#who').textContent=nomeDe(S.user?.email);
 render();renderDrawer();
}
let lt;function scheduleLoad(){clearTimeout(lt);lt=setTimeout(load,400)}
let canal;function subscribe(){if(canal)return;canal=sb.channel('apto-mudancas')
 .on('postgres_changes',{event:'*',schema:'public',table:'apto_apartamentos'},scheduleLoad)
 .on('postgres_changes',{event:'*',schema:'public',table:'apto_historico'},scheduleLoad).subscribe()}

async function upd(id,patch,histTxt,msg){
 const {error}=await sb.from('apto_apartamentos').update(patch).eq('id',id);
 if(error){toast('Não foi possível salvar: '+error.message);return false}
 if(histTxt)await sb.from('apto_historico').insert({apartamento_id:id,texto:histTxt});
 if(msg)toast(msg);
 await load();return true;
}

/* ---------- compatibilidade ---------- */
const tri=v=>v===true?true:v===false?false:null;
function checks(l){
 const c=S.crit,num=(v,ok)=>v==null||v===0?null:ok;
 const x=[
  {ok:num(l.preco,l.preco<=c.max),t:`Preço até ${fmt(c.max)}`,w:25},
  {ok:num(l.area,l.area>=c.area),t:`${c.area} m² ou mais`,w:15},
  {ok:num(l.quartos,l.quartos>=c.quartos),t:`${c.quartos} dormitórios ou mais`,w:15},
  {ok:num(l.banheiros,l.banheiros>=c.banheiros),t:`${c.banheiros} banheiros ou mais`,w:10},
  {ok:l.vagas==null?null:l.vagas>=c.vagas,t:`${c.vagas} vaga ou mais`,w:5},
  {ok:num(l.cond,l.cond<=c.cond),t:`Condomínio até ${fmt(c.cond)}`,w:10}];
 if(c.bairros?.length)x.unshift({ok:bairroOk(l.bairro),t:'Em um dos bairros escolhidos',w:15});
 if(c.suite)x.push({ok:l.suites==null?null:l.suites>=1,t:'Pelo menos 1 suíte',w:5});
 if(c.pets)x.push({ok:tri(l.condo.pets),t:'Aceita gatos',w:10});
 if(c.telas)x.push({ok:tri(l.condo.telas),t:'Permite telas de proteção',w:8});
 if(c.metro)x.push({ok:l.condo.metroDist==null?null:l.condo.metroDist<=800,t:'Metrô a até 800 m',w:10});
 if(c.cozinha)x.push({ok:tri(l.cozinhaAmpla),t:'Cozinha ampla',w:8});
 return x;
}
function score(l){const x=checks(l);const t=x.reduce((a,b)=>a+b.w,0);return Math.round(x.reduce((a,b)=>a+(b.ok===true?b.w:b.ok===null?b.w/2:0),0)/t*100)}
const scoreCls=s=>s>=80?'':s>=60?'mid':'low';

/* ---------- componentes ---------- */
function card(l,drag){
 const s=score(l);
 const visit=l.stage==='visita'&&l.visita?`<span class="tag visit">Visita ${fd(l.visita.data)} às ${l.visita.hora}</span>`:'';
 const alerta=l.alertas.length?`<span class="tag" style="background:var(--rose-soft)">${l.alertas.length} alerta${l.alertas.length>1?'s':''}</span>`:'';
 return `<button class="card" ${drag?'draggable="true"':''} data-id="${l.id}" onclick="openDrawer('${l.id}')">
  <div class="plan" style="--h:${l.hue}">${planSvg(l.plan)}<span class="src">${esc(l.fonte)}</span><span class="score ${scoreCls(s)}">${s}%</span></div>
  <div class="cb"><div class="price">${fmt(l.preco)}</div><div class="t">${esc(l.bairro)}</div>
  <div class="specs"><span>${l.area||'?'} m²</span><span>${l.quartos??'?'} dorm.</span><span>${l.banheiros??'?'} banh.</span><span>${l.vagas??'?'} vaga${l.vagas>1?'s':''}</span></div>
  <div class="specs"><span>Condomínio ${fmt(l.cond)}</span></div>${visit}${alerta}</div></button>`;
}
function visitRow(l,extra){const d=parseIso(l.visita.data);return `<button class="vrow" onclick="openDrawer('${l.id}')"><div class="vdate"><b>${d.getDate()}</b><span>${MESC[d.getMonth()]}</span></div><div><b>${esc(l.bairro)}${extra?', '+esc(l.endereco):''}</b><div class="sm muted">${SEM[d.getDay()]} às ${l.visita.hora}, ${esc(l.visita.com)}${extra?', '+stageName(l.stage):''}</div></div></button>`}

/* ---------- telas ---------- */
function vPainel(){
 const dias=Math.max(0,Math.ceil((new Date(2027,0,31)-new Date())/864e5));
 const ativos=S.list.filter(l=>l.stage!=='descartado');
 const vis=S.list.filter(l=>l.stage==='visita'&&l.visita&&l.visita.data>=todayIso()).sort((a,b)=>(a.visita.data+a.visita.hora).localeCompare(b.visita.data+b.visita.hora));
 const novos=S.list.filter(l=>l.stage==='novo').sort((a,b)=>score(b)-score(a));
 const max=Math.max(1,...STAGES.slice(0,5).map(s=>count(s.k)));
 return `
 <section class="hero">
  <div class="count">${KEYS}
   <div><div class="num">${dias}</div><p class="lbl">dias até o fim de janeiro. ${ativos.length} apartamento${ativos.length===1?'':'s'} em análise e ${vis.length} visita${vis.length===1?'':'s'} marcada${vis.length===1?'':'s'}.</p></div>
   <div class="row"><button class="btn solid" onclick="openAdd()">Adicionar link de anúncio</button></div>
  </div>
  <div class="funnel"><div class="p-head" style="margin:0"><h3>Onde cada apartamento está</h3><button class="link" onclick="go('funil')">Abrir funil</button></div>
   ${STAGES.slice(0,5).map(s=>`<button class="fbar" onclick="go('funil')"><span>${s.l}</span><span class="track"><span class="fill" style="display:block;width:${count(s.k)/max*100}%;background:${s.c}"></span></span><b>${count(s.k)}</b></button>`).join('')}
   <p class="sm muted" style="margin-top:auto">${count('descartado')} descartados. <button class="link sm" onclick="go('descartados')">Ver motivos</button></p>
  </div>
 </section>
 <div class="two">
  <section class="panel"><div class="p-head"><h3>Próximas visitas</h3><button class="link" onclick="go('calendario')">Calendário</button></div>
   ${vis.length?vis.map(l=>visitRow(l)).join(''):'<p class="empty">Nenhuma visita marcada. Abra um apartamento e use “Agendar visita”.</p>'}
  </section>
  <section class="panel"><div class="p-head"><h3>Novos para avaliar</h3></div>
   ${novos.length?`<div class="grid">${novos.map(l=>card(l)).join('')}</div>`:`<p class="empty">Nada novo por aqui. Cole o link de um anúncio para começar.</p><button class="btn primary" onclick="openAdd()">Adicionar link de anúncio</button>`}
  </section>
 </div>`;
}

function vFunil(){
 const cols=STAGES.filter(s=>s.k!=='descartado');
 return `<div class="page-head"><div><h2>Funil</h2><p class="muted">Arraste os cards entre as etapas. Soltar em “Descartar” pede o motivo.</p></div><button class="btn primary" onclick="openAdd()">+ Adicionar link</button></div>
 <div class="kanban-wrap"><div class="kanban">
 ${cols.map(s=>{const it=S.list.filter(l=>l.stage===s.k).sort((a,b)=>score(b)-score(a));return `<div class="col" data-stage="${s.k}"><div class="col-h"><span class="dot" style="background:${s.c}"></span>${s.l}<span class="n">${it.length}</span></div>${it.map(l=>card(l,true)).join('')||'<div class="drop-hint">Solte um card aqui</div>'}</div>`}).join('')}
 <div class="col trash" data-stage="descartado"><div class="col-h"><span class="dot" style="background:var(--rose)"></span>Descartar</div><div class="drop-hint">Solte aqui para descartar com motivo</div></div>
 </div></div>`;
}

function vCal(){
 const [y,m]=S.calM.split('-').map(Number);const mo=m-1;
 const first=new Date(y,mo,1),start=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),t=todayIso();
 let cells='';for(let i=0;i<start;i++)cells+='<div class="day out"></div>';
 for(let d=1;d<=days;d++){const iso=`${y}-${pad(m)}-${pad(d)}`;
  const ev=S.list.filter(l=>l.visita&&l.visita.data===iso&&l.stage!=='descartado').sort((a,b)=>a.visita.hora.localeCompare(b.visita.hora));
  cells+=`<div class="day ${iso===t?'today':''}" role="button" tabindex="0" onclick="openSchedule(null,'${iso}')" onkeydown="if(event.key==='Enter')openSchedule(null,'${iso}')"><span class="dn">${d}</span>${ev.map(l=>`<button class="ev v ${iso<t?'past':''}" onclick="event.stopPropagation();openDrawer('${l.id}')">${l.visita.hora} ${esc(l.bairro)}</button>`).join('')}</div>`}
 const rem=(start+days)%7;if(rem)for(let i=rem;i<7;i++)cells+='<div class="day out"></div>';
 const list=S.list.filter(l=>l.visita&&l.stage!=='descartado'&&l.visita.data.startsWith(S.calM)).sort((a,b)=>(a.visita.data+a.visita.hora).localeCompare(b.visita.data+b.visita.hora));
 return `<div class="cal-bar"><button class="btn sm" onclick="calNav(-1)" aria-label="Mês anterior">‹</button><h2>${MES[mo][0].toUpperCase()+MES[mo].slice(1)} ${y}</h2><button class="btn sm" onclick="calNav(1)" aria-label="Próximo mês">›</button>
  <span style="flex:1"></span><span class="gpill" style="background:var(--surface-2)">Google Agenda entra na etapa 2</span></div>
 <div class="cal">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
 <div class="legend"><span><i style="background:var(--oak)"></i>Visita a apartamento</span><span>Clique em um dia para agendar uma visita.</span></div>
 <section class="panel" style="margin-top:20px"><div class="p-head"><h3>Visitas deste mês</h3></div>
 ${list.length?list.map(l=>visitRow(l,true)).join(''):'<p class="empty">Nenhuma visita neste mês.</p>'}</section>`;
}
function calNav(n){const[y,m]=S.calM.split('-').map(Number);const d=new Date(y,m-1+n,1);S.calM=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()}

function vCrit(){
 const c=S.crit;
 const tog=(k,l)=>`<button class="chip ${c[k]?'on':''}" onclick="S.crit.${k}=!S.crit.${k};saveCrit();render()">${c[k]?'✓ ':''}${l}</button>`;
 return `<div class="page-head"><div><h2>Critérios</h2><p class="muted">Esses critérios calculam a nota de compatibilidade de cada apartamento. Ficam salvos para vocês dois.</p></div></div>
 <div class="motor"><section class="panel">
   <div class="field"><span>Bairros</span><div class="chips">${(c.bairros||[]).map((b,i)=>`<button class="chip on" onclick="rmBairro(${i})" aria-label="Remover ${esc(b)}">${esc(b)} <span class="x">×</span></button>`).join('')}<input id="nb" class="in" style="width:auto;flex:1;min-width:170px;padding:5px 11px;border-radius:99px" placeholder="Digite um bairro e Enter" onkeydown="if(event.key==='Enter')addBairro()"></div>${c.bairros?.length?'':'<span class="sm muted">Sem bairros na lista, a localização não entra na nota.</span>'}</div>
   <div class="frow"><label class="field"><span>Preço mínimo</span><input class="in" type="number" step="10000" value="${c.min}" onchange="setCrit('min',this.value)"></label><label class="field"><span>Preço máximo</span><input class="in" type="number" step="10000" value="${c.max}" onchange="setCrit('max',this.value)"></label></div>

function openDrawer(id){S.open=id;renderDrawer(true);$('#drawer').classList.add('on');$('#shade').classList.add('on');$('#drawer').scrollTop=0}

let nt;function setNote(id,v){const l=get(id);if(l)l.notas=v;clearTimeout(nt);nt=setTimeout(async()=>{const{error}=await sb.from('apto_apartamentos').update({notas:v}).eq('id',id);if(error)toast('Não foi possível salvar a nota')},700)}

/* ---------- ações ---------- */
function setStage(id,k){
 const l=get(id);if(!l||l.stage===k)return;
 if(k==='descartado')return openDiscard(id);
 if(k==='visita'&&!(l.visita&&l.visita.data>=todayIso()))return openSchedule(id);
 upd(id,{etapa:k},`Movido para ${stageName(k)}`,`Movido para ${stageName(k)}`);
}
function openSchedule(id,iso){
 const l=id?get(id):null;
 const opts=S.list.filter(x=>x.stage!=='descartado');
 if(!l&&!opts.length){toast('Adicione um apartamento antes de agendar uma visita.');return}
 const tm=new Date();tm.setDate(tm.getDate()+1);
 const date=iso||(l?.visita&&l.visita.data>=todayIso()?l.visita.data:isoOf(tm));
 openModal(`<h3>Agendar visita</h3>${l?`<p class="muted">${esc(l.bairro)}${l.endereco?', '+esc(l.endereco):''}</p>`:`<label class="lb">Apartamento<select id="sApt" class="in">${opts.map(o=>`<option value="${o.id}">${esc(o.bairro)}, ${o.area||'?'} m², ${fmt(o.preco)}</option>`).join('')}</select></label>`}
 <div class="frow"><label class="lb">Data<input type="date" id="sDate" class="in" value="${date}" onchange="busyCheck()"></label><label class="lb">Horário<input type="time" id="sTime" class="in" value="${l?.visita?.hora||'19:00'}" onchange="busyCheck()"></label></div>
 <label class="lb">Quem vai<select id="sWho" class="in"><option>Rafa e Lucas</option><option>Só a Rafa</option><option>Só o Lucas</option></select></label>
 <div id="sBusy" class="busy"></div>
 <div class="m-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSchedule(${l?`'${l.id}'`:'null'})">Agendar visita</button></div>`);
 busyCheck();
}
function busyCheck(){const d=$('#sDate')?.value,t=$('#sTime')?.value,b=$('#sBusy');if(!b)return;
 const v=S.list.filter(x=>x.visita&&x.visita.data===d&&x.stage==='visita');const clash=v.some(x=>x.visita.hora===t);
 b.className='busy'+(clash?' warn':'');b.textContent=v.length?(clash?'Conflito de horário. ':'')+'Nesse dia: '+v.map(x=>`${x.visita.hora} visita em ${x.bairro}`).join('; ')+'.':'Nenhuma outra visita nesse dia.'}
async function saveSchedule(id){
 const aid=id||$('#sApt').value;const d=$('#sDate').value,t=$('#sTime').value,w=$('#sWho').value;
 if(!d||!t){toast('Escolha data e horário.');return}
 closeModal();await upd(aid,{etapa:'visita',visita_data:d,visita_hora:t,visita_com:w},`Visita agendada para ${fd(d)} às ${t}`,'Visita agendada');
}
function openDiscard(id){
 openModal(`<h3>Descartar apartamento</h3><p class="muted">O motivo fica registrado para vocês lembrarem depois.</p>
 <div class="reasons" role="radiogroup">${REASONS.map((r,i)=>`<label class="rchip"><input type="radio" name="rs" value="${r}" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}</div>
 <label class="lb">Detalhes (opcional)<textarea id="dObs" class="in" rows="3" placeholder="Ex.: janela dos quartos para a avenida"></textarea></label>
 <div class="m-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="saveDiscard('${id}')">Descartar</button></div>`);
}
async function saveDiscard(id){
 const l=get(id);const m=document.querySelector('input[name="rs"]:checked').value,o=$('#dObs').value.trim();
 closeModal();await upd(id,{etapa:'descartado',etapa_anterior:l.stage,descarte_motivo:m,descarte_obs:o||null,descartado_em:todayIso()},`Descartado: ${m}`,'Apartamento descartado');
}
function restore(id){const l=get(id);const p=l.prev&&l.prev!=='visita'?l.prev:'novo';upd(id,{etapa:p,etapa_anterior:null,descarte_motivo:null,descarte_obs:null,descartado_em:null},`Voltou para ${stageName(p)}`,`Voltou para ${stageName(p)}`)}
function openDelete(id){openModal(`<h3>Excluir apartamento?</h3><p class="muted">Ele some do app junto com notas e histórico. Para guardar o motivo, prefira “Descartar”.</p><div class="m-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="doDelete('${id}')">Excluir</button></div>`)}
async function doDelete(id){closeModal();const{error}=await sb.from('apto_apartamentos').delete().eq('id',id);if(error){toast('Não foi possível excluir: '+error.message);return}closeDrawer();toast('Apartamento excluído');load()}

/* ---------- adicionar por link ---------- */
function stepsHtml(st,i){return `<ul class="steps">${st.map((s,k)=>`<li class="${k<i?'done':k===i?'act':''}"><span class="ic">${k<i?'<svg viewBox="0 0 20 20" width="10"><path d="M4 10.5 8 14l8-8" fill="none" stroke="currentColor" stroke-width="3"/></svg>':''}</span>${s}</li>`).join('')}</ul>`}
function srcOf(u){const s=u.toLowerCase();if(s.includes('quintoandar'))return'QuintoAndar';if(s.includes('remax'))return'RE/MAX';if(s.includes('lopes'))return'Lopes';if(s.includes('coelhodafonseca'))return'Coelho da Fonseca';if(s.includes('zapimoveis'))return'Zap Imóveis';try{return new URL(u).hostname.replace('www.','')}catch(e){return'Link'}}
function openAdd(){
 if(!S.user)return;
 openModal(`<h3>Adicionar anúncio por link</h3><p class="muted">Cole o link de um anúncio. O Gemini lê a página, extrai os dados e pesquisa o condomínio. Leva até um minuto.</p>
 <input id="addUrl" class="in" type="url" placeholder="https://www.quintoandar.com.br/imovel/..." onkeydown="if(event.key==='Enter')runAdd()">
 <div class="m-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="runAdd()">Analisar anúncio</button></div>`);
 setTimeout(()=>$('#addUrl')?.focus(),50);
}
async function errMsg(error){try{const j=await error.context.json();return j.erro||error.message}catch(e){return error?.message||'Erro desconhecido'}}
async function runAdd(){
 const u=$('#addUrl').value.trim();
 if(!/^https?:\/\/\S+\.\S+/.test(u)){$('#addUrl').style.borderColor='var(--rose)';toast('Cole um link completo, começando com https://');return}
 const dup=S.list.find(l=>l.url===u);if(dup){closeModal();toast('Esse anúncio já está no app');openDrawer(dup.id);return}
 const st=['Lendo o anúncio','Extraindo preço, área e características','Organizando os dados do condomínio'];
 let i=0;$('#mbox').innerHTML=`<h3>Analisando anúncio</h3><p class="sm muted" style="word-break:break-all">${esc(u)}</p><div id="addSteps">${stepsHtml(st,0)}</div>`;
 const timer=setInterval(()=>{if(i<st.length-1){i++;const b=$('#addSteps');if(b)b.innerHTML=stepsHtml(st,i)}},4000);
 const {data,error}=await sb.functions.invoke('analisar-anuncio',{body:{url:u}});
 clearInterval(timer);
 if(!$('#modal').classList.contains('on'))return;
 if(error){const m=await errMsg(error);window._lastUrl=u;
  $('#mbox').innerHTML=`<h3>Não foi possível ler o anúncio</h3><p class="muted">${esc(m)}</p><p class="sm muted">${/Gemini respondeu (401|403|404)|GEMINI_API_KEY/.test(m)?'O problema está na configuração do Gemini no Supabase (chave ou modelo), não no anúncio.':/Gemini respondeu 429/.test(m)?'O limite do plano gratuito do Gemini foi atingido. Esperem alguns minutos e tentem de novo.':'Alguns sites bloqueiam a leitura automática. Vocês podem tentar de novo ou preencher os dados na mão.'}</p>
  <div class="m-actions"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn" onclick="showPreview({url:window._lastUrl,fonte:srcOf(window._lastUrl)},true)">Preencher na mão</button><button class="btn primary" onclick="openAdd();setTimeout(()=>{$('#addUrl').value=window._lastUrl},60)">Tentar de novo</button></div>`;return}
 showPreview(data,false);
}
const FIELDS=[['titulo','Título','text','s3'],['bairro','Bairro','text',''],['endereco','Rua','text','s2'],['preco','Preço (R$)','number',''],['valor_condominio','Condomínio (R$)','number',''],['iptu_mensal','IPTU por mês (R$)','number',''],['area','Área (m²)','number',''],['quartos','Dormitórios','number',''],['suites','Suítes','number',''],['banheiros','Banheiros','number',''],['vagas','Vagas','number',''],['andar','Andar','text','']];
function showPreview(d,manual){
 window._pending=d;const c=d.condominio||{};const al=Array.isArray(d.alertas)?d.alertas:[];
 $('#mbox').classList.add('wide');
 $('#mbox').innerHTML=`<h3>${manual?'Preencher dados do anúncio':'Confira os dados encontrados'}</h3>
 <p class="sm muted">${manual?'Preencha o que souber. Dá para editar depois pelo Supabase.':'O Gemini pode errar. Corrijam o que estiver diferente do anúncio antes de salvar.'}</p>
 <div class="fgrid">${FIELDS.map(([k,lbl,t,cl])=>`<label class="lb ${cl}">${lbl}<input class="in" id="f_${k}" type="${t}" value="${esc(d[k]??'')}"></label>`).join('')}</div>
 ${!manual?`<div class="result-note" style="margin:0">${c.nome?`Condomínio <b>${esc(c.nome)}</b>${c.ano?`, construído em ${esc(c.ano)}`:''}${c.nota?`, nota ${String(c.nota).replace('.',',')} de 5`:''}.`:'Nenhuma informação do condomínio encontrada.'} Os dados do condomínio vêm do anúncio e do que o Gemini já sabe sobre o prédio. Confirmem na visita.</div>`:''}
 ${al.length?`<ul class="attn warn" style="margin:0">${al.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
 <div class="m-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveBtn" onclick="savePending()">Salvar em Novos</button></div>`;
}
async function savePending(){
 const d=window._pending;if(!d)return;
 const v=k=>{const el=$('#f_'+k);if(!el)return null;const x=el.value.trim();if(x==='')return null;return el.type==='number'?Number(x):x};
 const row={url:d.url,fonte:d.fonte||srcOf(d.url),descricao:d.descricao||null,cozinha_ampla:typeof d.cozinha_ampla==='boolean'?d.cozinha_ampla:null,
  condominio:d.condominio||{},alertas:Array.isArray(d.alertas)?d.alertas:[],etapa:'novo'};
 FIELDS.forEach(([k])=>row[k]=v(k));
 $('#saveBtn').disabled=true;
 const {data,error}=await sb.from('apto_apartamentos').insert(row).select('id').single();
 if(error){$('#saveBtn').disabled=false;toast(error.code==='23505'?'Esse anúncio já está no app':'Não foi possível salvar: '+error.message);return}
 await sb.from('apto_historico').insert({apartamento_id:data.id,texto:'Adicionado por link'});
 window._pending=null;closeModal();toast('Salvo em Novos');await load();openDrawer(data.id);
}

 <p class="sm muted">No Supabase: Project Settings, API Keys, chave que começa com <span class="code">sb_publishable_</span>.</p>
 <label class="lb">Chave publishable<input id="kIn" class="in" autocomplete="off" spellcheck="false" placeholder="sb_publishable_..." onkeydown="if(event.key==='Enter')saveKey()"></label>
 <button class="btn primary" onclick="saveKey()">Salvar e continuar</button><p class="err" id="kErr"></p></div></div>`;
}
function saveKey(){
 const k=$('#kIn').value.trim();
 if(/^sb_secret_/i.test(k)||/service_role/i.test(k)){$('#kErr').textContent='Essa é a chave secret. Ela nunca deve ir para o navegador. Use a publishable.';$('#kIn').value='';return}
 if(!/^sb_publishable_\S+$/.test(k)&&!/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(k)){$('#kErr').textContent='Essa não parece uma chave publishable. Ela começa com sb_publishable_.';return}
 try{localStorage.setItem('proximo-lar-sbkey',k)}catch(e){$('#kErr').textContent='Este navegador não permitiu guardar a chave.';return}
 location.reload();
}
function forgetKey(){try{localStorage.removeItem('proximo-lar-sbkey')}catch(e){}location.reload()}
function renderLogin(){
 document.body.classList.add('out');closeDrawer();
 $('#app').innerHTML=`<div class="login"><div class="lbox"><h2>Entrar</h2><p class="muted">Use o e-mail e a senha cadastrados no Supabase.</p>
 <label class="lb">E-mail<input id="lEmail" class="in" type="email" autocomplete="username"></label>
 <label class="lb">Senha<input id="lPass" class="in" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
 <button class="btn primary" id="lBtn" onclick="doLogin()">Entrar</button><p class="err" id="lErr"></p></div></div>`;
}
async function doLogin(){
 const e=$('#lEmail').value.trim(),p=$('#lPass').value;if(!e||!p){$('#lErr').textContent='Preencha e-mail e senha.';return}
 $('#lBtn').disabled=true;$('#lErr').textContent='';
 const {error}=await sb.auth.signInWithPassword({email:e,password:p});
 if(error){$('#lBtn').disabled=false;$('#lErr').textContent='E-mail ou senha incorretos.'}
}
async function logout(){await sb.auth.signOut()}
async function start(){
 document.body.classList.remove('out');
 $('#app').innerHTML='<p class="loading">Carregando apartamentos...</p>';
 await load();subscribe();
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function openModal(h){$('#mbox').classList.remove('wide');$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function go(v){S.view=v;try{localStorage.setItem('proximo-lar-view',v)}catch(e){}render();window.scrollTo(0,0)}
function render(){
 if(!S.user)return;
 if(S.semAcesso){$('#app').innerHTML=`<div class="login"><div class="lbox"><h2>Acesso não liberado</h2><p class="muted">Seu e-mail entrou, mas não está na tabela <span class="code">apto_membros</span> do Supabase. Cadastre-o lá e recarregue a página.</p><button class="btn" onclick="logout()">Sair</button></div></div>`;return}
 document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 const fn={painel:vPainel,funil:vFunil,calendario:vCal,criterios:vCrit,descartados:vDesc}[S.view]||vPainel;
 $('#app').innerHTML=fn()+`<div class="foot">Conectado como ${esc(nomeDe(S.user.email))}. <button class="link sm" onclick="logout()">Sair</button>${SUPABASE_KEY.startsWith('COLE')?' <button class="link sm" onclick="forgetKey()">Trocar chave do Supabase</button>':''}</div>`;
 if(S.view==='funil')bindDrag();
}
function bindDrag(){
 document.querySelectorAll('.kanban .card').forEach(c=>{c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging')});c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
 document.querySelectorAll('.kanban .col').forEach(col=>{
  col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
  col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});
  col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)setStage(id,col.dataset.stage)});
 });
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else closeDrawer()}});

(async function init(){
 if(!configurado)return renderSetup();
 const {data:{session}}=await sb.auth.getSession();
 S.user=session?.user||null;
 sb.auth.onAuthStateChange((_ev,sess)=>{const tinha=!!S.user;S.user=sess?.user||null;if(!!S.user!==tinha)setTimeout(()=>S.user?start():renderLogin(),0)});
 S.user?start():renderLogin();
})();
</script>
</body>
</html>
